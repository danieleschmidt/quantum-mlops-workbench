[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "quantum-mlops-workbench"
version = "1.0.0"
description = "Experiment tracking, circuit versioning, and reproducibility for hybrid quantum-classical ML"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Daniel Schmidt" }]
dependencies = []  # stdlib only

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
